<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignUp page</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap:10px;
}
body {
    margin-top:150px;
    margin-left:400px;
    min-height: 60vh;
    background-color:rosybrown;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap:wrap;
    width:40%;
}
.signup-box {
    width: 380px;
    background-color: white;
    padding: 35px;
    border-radius: 15px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    text-align: center;
}
h1 {
    color: #4f46e5;
    margin-bottom: 25px;
    font-size: 30px;
}
input {
    width: 100%;
    padding: 12px 15px;
    margin-bottom: 15px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}
input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}
p {
    flex-wrap:wrap;
    color: white;
    font-size: 14px;
    margin-top: 15px;
}
button {
    background-color: #4f46e5;
    color: white;
    border: none;
    padding: 8px 15px;
    border-radius: 6px;
    cursor: pointer;
    
}
button:hover {
    background-color: #3730a3;
}
#signupBtn {
    width:60%;
    align-items:center;
    justify-content:center;
    padding: 10px 25px;
    font-weight: bold; 
}
.signin{
    display: flex;
    justify-content: center;
    align-items: center;
}
@media (max-width: 768px) {
    body {
        padding: 20px;
    }
    .signup-box {
        width: 360px;
        padding: 30px;
    }
    h1 {
        font-size: 28px;
    }
}
@media (max-width: 480px) {
    body {
        padding: 15px;
    }
    .signup-box {
        width: 100%;
        padding: 25px 20px;
        border-radius: 12px;
    }
    h1 {
        font-size: 25px;
        margin-bottom: 20px;
    }
    input {
        padding: 11px 12px;
        font-size: 14px;
    }
    p {
        font-size: 13px;
    }
    button {
        padding: 7px 12px;
        font-size: 13px;
    }
    #signupBtn {
        padding: 9px 20px;
    }
}
@media (max-width: 350px) {
    body {
        padding: 10px;
    }
    .signup-box {
        padding: 20px 15px;
    }
    h1 {
        font-size: 23px;
    }
    p {
        font-size: 12px;
    }
    button {
        font-size: 12px;
        padding: 6px 10px;
    }
}
@media (max-width: 480px) {

    body {
        margin: 0;
        width: 100%;
        min-height: 100vh;
        padding: 20px;
        flex-direction: column;
    }

    h1 {
        font-size: 26px;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        max-width: 350px;
    }

    .container {
        width: 100%;
    }

    #signupBtn {
        width: 100%;
        max-width: 350px;
    }

    .signin {
        width: 100%;
    }

    .signin p {
        font-size: 13px;
        text-align: center;
    }

    .signin button {
        padding: 6px 10px;
        font-size: 12px;
    }
}
    </style>
</head>
<body>
    <h1>Sign up</h1>
    <input type="email" name="" id="semail" placeholder="Enter your email">
    <input type="password" name="" id="spass" placeholder="Enter your password">
    <div class="container">
    <button id="signupBtn">Sign up</button>
    <div class="signin">
    <p >If you have an account ? <button  id="goSignin">Sign In</button></p>
    </div>
</div>
    <script src="app.js" type="module"></script>
</body>
</html>
